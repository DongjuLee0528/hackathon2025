spring.config.import=optional:file:.env[.properties]

# ================================
# App
spring.application.name=hackathonBack
server.port=8080
server.forward-headers-strategy=framework
server.use-forward-headers=true
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto
server.tomcat.port-header=X-Forwarded-Port
server.tomcat.protocol-header-https-value=https

# ?? ?? ?? (SameSite=None + Secure)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=None

# ================================
# ? CORS (??? ??? ??)
app.cors.allowed-origins=https://thecoder.djloghub.com,http://localhost:5173

# ================================
# DB  (.env ? DB_URL/DB_USERNAME/DB_PASSWORD)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# ================================
# OAuth2 Redirect
app.frontend.base=https://thecoder.djloghub.com
app.frontend.failure-redirect=https://thecoder.djloghub.com/oauth/failure
# app.debug=true

# ================================
# OAuth GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.client-name=GitHub
spring.security.oauth2.client.registration.github.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=id

# ================================
# GPT
gpt.problem.key=${GPT_PROBLEM_KEY:default-problem-key}
gpt.problem.model=${GPT_PROBLEM_MODEL:gpt-3.5-turbo}
gpt.judge.api.key=${GPT_JUDGE_KEY:default-judge-key}
gpt.judge.model=${GPT_JUDGE_MODEL:gpt-3.5-turbo}
gpt.review.key=${GPT_REVIEW_KEY:default-review-key}
gpt.review.model=${GPT_REVIEW_MODEL:gpt-4-turbo}
gpt.feedback.key=${GPT_FEEDBACK_KEY:default-feedback-key}
gpt.feedback.model=${GPT_FEEDBACK_MODEL:gpt-4-turbo}

# ================================
# Swagger/Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.web.resources.chain.enabled=false

# ================================
# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-validity=900000
jwt.refresh-token-validity=1209600000

# --- submissions retention / size (??) ---
submission.save.max-bytes=200000
submission.retain.raw.days=90