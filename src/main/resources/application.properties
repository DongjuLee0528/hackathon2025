# ================================
# ?/??
spring.application.name=hackathonBack
server.port=8080
# ???/??? ???(Nginx) ??? ?????/??? URL ???
server.forward-headers-strategy=framework

# ================================
# DB (??? .env/????? ??)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# ================================
# OAuth2 - ??(??/?? ? ???? ?? URL)
# ? ??? ??/?? ? ??? ????? ??
app.frontend.success-redirect=https://thecoder.djloghub.com/oauth/success
app.frontend.failure-redirect=https://thecoder.djloghub.com/oauth/failure

# ================================
# ? JWT ?? ?? (?? ???? ?? ? ?? ??)
# app.jwt.secret=${JWT_SECRET}
# app.jwt.expiry-seconds=${JWT_EXPIRY_SECONDS:2592000}

# ================================
# OAuth GitHub (??? ????? ??)
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.client-name=GitHub
spring.security.oauth2.client.registration.github.authorization-grant-type=authorization_code

spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
# GitHub ?? user ?? ? - login(??) ?? id(??) ? ?1
spring.security.oauth2.client.provider.github.user-name-attribute=login

# ================================
# OAuth GitLab (??? ????? ??)
spring.security.oauth2.client.registration.gitlab.client-id=${GITLAB_CLIENT_ID}
spring.security.oauth2.client.registration.gitlab.client-secret=${GITLAB_CLIENT_SECRET}
spring.security.oauth2.client.registration.gitlab.scope=read_user,email,read_repository
spring.security.oauth2.client.registration.gitlab.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.gitlab.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.gitlab.client-name=GitLab

spring.security.oauth2.client.provider.gitlab.authorization-uri=https://gitlab.com/oauth/authorize
spring.security.oauth2.client.provider.gitlab.token-uri=https://gitlab.com/oauth/token
spring.security.oauth2.client.provider.gitlab.user-info-uri=https://gitlab.com/api/v4/user
spring.security.oauth2.client.provider.gitlab.user-name-attribute=username

# ================================
# GPT (???? ??? ??)
gpt.problem.key=${GPT_PROBLEM_KEY:default-problem-key}
gpt.problem.model=${GPT_PROBLEM_MODEL:gpt-3.5-turbo}
gpt.judge.api.key=${GPT_JUDGE_KEY:default-judge-key}
gpt.judge.model=${GPT_JUDGE_MODEL:gpt-3.5-turbo}
gpt.review.key=${GPT_REVIEW_KEY:default-review-key}
gpt.review.model=${GPT_REVIEW_MODEL:gpt-4-turbo}
gpt.feedback.key=${GPT_FEEDBACK_KEY:default-feedback-key}
gpt.feedback.model=${GPT_FEEDBACK_MODEL:gpt-4-turbo}

# ================================
# Swagger/???
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.web.resources.chain.enabled=false
